/* ===== Hombre (oscuro, ángulos, Archivo ancho) ===== */
[data-genero="hombre"]{
--bg:#0d0f12;--bg2:#1b1e24;--line:#262a32;--surface:#14171c;--ink:#e6e9ee;--ink2:#9099a6;--head:#fff;
--lime:#c8e23a;--moss:#9fbd22;--sh:0,0,0;
--on-bg:#c8e23a;--on-fg:#0d0f12;--thumb:#c8e23a;--thumb-fg:#0d0f12;--plate:#fff;
--display:'Sora','Hanken Grotesk',system-ui,sans-serif;--r:18px;--rb:14px;--tw:700;--tt:-.025em;
--cut:none;--cut-s:none;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;transition:background-color .5s}
input{-webkit-user-select:text;user-select:text}
img{max-width:100%;-webkit-user-drag:none}
svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
::selection{background:var(--lime);color:#1c1d17}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}

/* ===== Fondo infinito en movimiento constante (solo transform / dash: liviano en móvil) ===== */
.defs{position:absolute;width:0;height:0}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg)}
.blob{position:absolute;width:80vmax;height:80vmax;border-radius:50%;will-change:transform}
.b1{left:-30vmax;top:-25vmax;background:radial-gradient(closest-side,rgba(163,181,44,.34),transparent);animation:drift 22s ease-in-out infinite alternate}
.b2{right:-35vmax;bottom:-30vmax;background:radial-gradient(closest-side,rgba(101,124,28,.22),transparent);animation:drift 28s ease-in-out -9s infinite alternate-reverse}
.grid{display:none;position:absolute;inset:-48px;background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/48px 48px;opacity:.5;animation:grid 7s linear infinite;will-change:transform}
.inf{position:absolute;left:50%;top:50%;width:170vmax;height:auto;margin:-57vmax 0 0 -85vmax;will-change:transform}
.inf use{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round}
.i1{animation:sway1 34s ease-in-out infinite alternate}
.i2{width:95vmax;margin:-10vmax 0 0 -15vmax;animation:sway2 26s ease-in-out infinite alternate}
.inf .base{stroke:var(--lime);stroke-width:1.5;opacity:.28}
.inf .run{stroke:var(--lime);stroke-width:4;stroke-dasharray:130 870;animation:flow 13s linear infinite}
.i2 .base{stroke:var(--moss)}.i2 .run{stroke:var(--moss);stroke-dasharray:90 910;animation:flow 9s linear -3s infinite reverse}
@keyframes flow{to{stroke-dashoffset:-1000}}
@keyframes drift{to{transform:translate3d(14vmax,10vmax,0) scale(1.15)}}
@keyframes grid{to{transform:translate3d(48px,48px,0)}}
@keyframes sway1{from{transform:rotate(-14deg) translate3d(-3vmax,0,0)}to{transform:rotate(-4deg) translate3d(3vmax,2vmax,0) scale(1.06)}}
@keyframes sway2{from{transform:rotate(10deg) translate3d(0,0,0)}to{transform:rotate(22deg) translate3d(-4vmax,-3vmax,0) scale(1.1)}}

/* ===== Estructura ===== */
#appContent{position:relative;animation:fade .6s var(--ease) both}
.page{position:relative;z-index:1}
@keyframes fade{from{opacity:0}}

/* Botones propios de la marca */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 10px 0 26px;border-radius:var(--rb);clip-path:var(--cut);font-weight:700;font-size:.95rem;white-space:nowrap;text-decoration:none;overflow:hidden;isolation:isolate;transition:transform .2s var(--ease),background-color .3s}
.btn:active{transform:scale(.96)}
.btn .go{display:grid;place-items:center;width:36px;height:36px;border-radius:calc(var(--rb) * .6);background:rgba(255,255,255,.22);transition:transform .45s var(--pop)}
.btn:active .go{transform:rotate(-45deg) scale(1.1)}
.btn-wa{background:linear-gradient(135deg,var(--lime),var(--moss));color:#fff;box-shadow:0 14px 26px -12px rgba(101,124,28,.7)}
.btn-wa::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.6s ease-in-out 1s infinite}
@keyframes shine{40%,100%{transform:translateX(120%)}}
.btn-ghost{padding:0 26px;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:var(--rb)}
.btn-go{background:var(--on-bg);color:var(--on-fg)}
.btn-go .go{background:rgba(255,255,255,.18)}

/* Hero */
.hero{position:relative;padding:calc(12px + env(safe-area-inset-top)) 14px 0}
.hero-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{height:46px;width:auto;padding:3px 8px;border-radius:calc(var(--r) * .5);background:var(--plate);animation:rise .7s var(--ease) both}
.hero-text{min-width:0;animation:rise .8s var(--ease) .08s both}
.hero-title{display:flex;flex-direction:column;font-family:var(--display);font-weight:var(--tw);letter-spacing:var(--tt);font-size:1.5rem;line-height:1.02;color:var(--head)}
.hero-title .t1{font-size:.62em;font-weight:500;opacity:.7;font-family:var(--sans);letter-spacing:0}
.hero-sub,.hero .btn{display:none}
.ticker{margin:12px -14px 0;overflow:hidden;border-block:1px solid var(--line);padding:7px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;width:max-content;animation:tick 38s linear infinite;will-change:transform}
.track span{display:flex;align-items:center;gap:14px;padding-right:14px;font-size:.82rem;font-weight:650;color:var(--ink2);white-space:nowrap}
.track b{color:var(--lime);font-size:1.15rem;font-weight:400}
@keyframes tick{to{transform:translate3d(-50%,0,0)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}

/* Controles */
.controls{position:sticky;top:0;z-index:100;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 93%,transparent);box-shadow:0 1px 0 var(--line);transition:transform .4s var(--ease)}
.controls-in{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink2);pointer-events:none}
.search input{width:100%;height:44px;padding:0 16px 0 42px;border:0;border-radius:var(--rb);clip-path:var(--cut-s);background:var(--surface);color:var(--ink);font:inherit;font-size:1rem;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .25s}
.search input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--lime)}
.seg{position:relative;flex:none;display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:var(--rb);background:var(--bg2);clip-path:var(--cut-s)}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:calc(var(--rb) - 3px);background:var(--thumb);transform:translateX(calc(var(--i,0)*100%));transition:transform .38s var(--pop)}
.seg:has(.sb:nth-child(2).active){--i:1}.seg:has(.sb:nth-child(3).active){--i:2}
.sb{position:relative;z-index:1;min-height:36px;padding:0 14px;font-size:.82rem;font-weight:700;color:var(--ink2);white-space:nowrap;transition:color .25s}
.sb.active{color:var(--thumb-fg)}
.stats{max-width:1400px;margin:0 auto;padding:14px 16px 0;display:flex;justify-content:space-between;gap:12px;font-size:.82rem;color:var(--ink2)}
.stats strong{color:var(--head);font-weight:800}
#activeFilterLabel{display:none}
.container{max-width:1400px;margin:0 auto;padding:4px 12px 40px}

/* Secciones y tarjetas: cada categoría tiene su propio color y entrada */
.sec{display:flex;align-items:center;gap:12px;margin:34px 0 14px}
.sec:first-child{margin-top:16px}
.sec h2{font-family:var(--display);font-weight:var(--tw);letter-spacing:var(--tt);font-size:1.35rem;line-height:1.1;color:var(--head);animation:rise .5s var(--ease) both}
.sec p{font-size:.78rem;color:var(--ink2)}
.sec::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--acc),transparent);transform-origin:left;animation:line .8s var(--ease) .15s both}
.sec-t{display:flex;flex-direction:column}
@keyframes line{from{transform:scaleX(0)}}
.grid-p{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;border-radius:var(--r);clip-path:var(--cut);overflow:hidden;background:var(--surface);box-shadow:0 1px 2px rgba(var(--sh),.06),0 12px 26px -16px rgba(var(--sh),.28);cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 300px;animation:var(--fx,fx0) .55s var(--ease) calc(var(--i,0)*45ms) both;transition:transform .3s var(--ease)}
.card:nth-child(n+9){animation:none}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.card:active{transform:scale(.97)}.card:active::after{transform:none}
.pimg{position:relative;aspect-ratio:1;overflow:hidden;background:var(--bg2)}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.card:active .pimg img{transform:scale(1.07)}
.badge{position:absolute;top:8px;left:8px;z-index:2;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.92);color:#2b2e22;font-size:.68rem;font-weight:750}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc)}
.pinfo{display:flex;flex-direction:column;gap:6px;padding:10px 12px 12px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-family:var(--display);font-weight:var(--tw);font-size:1.12rem;line-height:1.1;color:var(--head)}
.price::after{content:"";display:block;width:24px;height:3px;margin-top:4px;border-radius:3px;background:var(--acc);transition:width .4s var(--ease)}
.card:active .price::after{width:100%}
.code{font-size:.66rem;font-weight:650;color:var(--ink2)}
.arrow{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;clip-path:var(--cut-s);background:var(--acc);color:#1c1d17;transition:transform .45s var(--pop)}
.card:active .arrow{transform:rotate(-45deg) scale(1.12)}
.pname{font-size:.84rem;font-weight:700;line-height:1.28;color:var(--head);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pdet{list-style:none;display:grid;gap:3px}
.pdet li{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--ink2)}
.pdet svg{width:13px;height:13px;color:var(--acc)}
.pdet span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdet li:nth-child(3){align-items:flex-start}.pdet li:nth-child(3) span{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3}.pdet li:nth-child(3) svg{margin-top:2px;flex:none}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--moss)}
.ph svg{width:40px;height:40px;stroke-width:1.2}.ph b{font-family:var(--display);color:var(--head)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:80px 20px;color:var(--ink2)}
.empty svg{width:44px;height:44px;color:var(--lime);margin-bottom:14px;animation:float 3s ease-in-out infinite}
.empty h3{font-family:var(--display);font-weight:var(--tw);font-size:1.5rem;color:var(--head)}
@keyframes float{50%{transform:translateY(-8px)}}

/* Entradas por categoría (6 estilos que se alternan) */
@keyframes fx0{from{opacity:0;transform:translateY(26px)}}
@keyframes fx1{from{opacity:0;transform:perspective(600px) rotateX(-32deg) translateY(14px)}}
@keyframes fx2{from{opacity:0;transform:scale(.8)}}
@keyframes fx3{from{opacity:0;transform:translateX(-34px)}}
@keyframes fx4{from{opacity:0;transform:translateX(34px) rotate(2deg)}}
@keyframes fx5{from{opacity:0;transform:translateY(-22px) scale(.94)}}

/* Efecto al elegir una opción: infinito dibujado + onda de color */
#fx{position:fixed;inset:0;z-index:900;pointer-events:none;overflow:hidden}
.burst{position:absolute;left:var(--x);top:var(--y);width:0;height:0}
.burst::before{content:"";position:absolute;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;background:var(--c);opacity:.32;animation:wave .7s var(--ease) forwards}
.burst svg{position:absolute;width:300px;height:200px;margin:-100px 0 0 -150px;stroke:var(--c);animation:inflate .8s var(--ease) forwards}
.burst use{vector-effect:non-scaling-stroke;stroke-width:3;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw .7s ease-out forwards}
@keyframes wave{to{transform:scale(14);opacity:0}}
@keyframes inflate{from{transform:scale(.15)}60%{opacity:1}to{transform:scale(3.4);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}

/* Sello en la foto ampliada: emblema completo + código, pequeño y legible */
.wm{position:absolute;right:10px;bottom:10px;z-index:2;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border-radius:min(var(--rb),18px);background:rgba(16,18,14,.58);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);pointer-events:none}

.lbw{position:relative;display:flex;max-width:100%;max-height:100%}
.lb img{max-height:calc(100dvh - 60px)}
/* Pie */
.footer{position:relative;z-index:1;background:var(--surface);box-shadow:0 -1px 0 var(--line);padding:34px 16px calc(30px + env(safe-area-inset-bottom));text-align:center}

.modal{position:relative;display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);width:100%;max-height:92dvh;overflow:hidden;border-radius:26px 26px 0 0;clip-path:var(--cut);background:var(--surface);transform:translateY(100%);transition:transform .42s var(--ease)}
.ov.active .modal{transform:none}
.mimg{position:relative;aspect-ratio:4/3;background:var(--bg2);overflow:hidden}
.mimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mimg.zoom{cursor:zoom-in}
.mimg .badge{top:14px;left:14px;padding:7px 14px;font-size:.8rem}
.zh{position:absolute;right:12px;bottom:12px;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);color:#2b2e22}
.mc{display:flex;flex-direction:column;padding:20px 18px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain}
.mc>*{animation:rise .5s var(--ease) both}
.mc>:nth-child(2){animation-delay:.05s}.mc>:nth-child(3){animation-delay:.1s}.mc>:nth-child(4){animation-delay:.15s}
.mt{font-family:var(--display);font-weight:var(--tw);letter-spacing:var(--tt);font-size:1.5rem;line-height:1.12;color:var(--head);padding-right:36px}
.mp{margin-top:8px;font-family:var(--display);font-weight:var(--tw);font-size:1.9rem;color:var(--head)}
.mp::after{content:"";display:block;width:44px;height:4px;margin-top:6px;border-radius:4px;background:var(--acc)}
.mcode{margin-top:8px;font-size:.8rem;font-weight:650;color:var(--ink2)}
.md{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}
.mdi{display:flex;gap:10px;padding:12px;border-radius:calc(var(--r) * .6);background:var(--bg)}
.mdi svg{margin-top:2px;color:var(--acc)}
.mdi small{display:block;font-size:.72rem;font-weight:650;color:var(--ink2)}
.mdi b{display:block;font-size:.88rem;line-height:1.3;color:var(--head)}
.macts{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.mx{position:absolute;top:12px;right:12px;z-index:4;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.94);color:#2b2e22;transition:transform .3s var(--pop)}
.mx:active{transform:rotate(90deg) scale(.9)}
.lb{position:fixed;inset:0;z-index:1100;display:flex;align-items:center;justify-content:center;padding:30px;background:rgba(10,12,6,.95);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.lb.active{opacity:1;visibility:visible;transition-delay:0s}
.lb img{max-width:100%;max-height:100%;object-fit:contain;transform:scale(.94);transition:transform .4s var(--ease)}
.lb.active img{transform:none}

.seg{width:100%}
.n{min-width:28px;padding:3px 9px;border-radius:var(--rb);background:var(--bg2);color:var(--ink2);font-size:.74rem;font-weight:750;text-align:center;transition:background-color .3s,color .3s}
.dd-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 12px 0 16px;border-radius:var(--rb);clip-path:var(--cut-s);background:var(--on-bg);color:var(--on-fg);font-weight:750;font-size:.95rem;text-align:left;transition:transform .2s var(--ease)}
.dd-btn:active{transform:scale(.97)}
.dd-btn .dot,.opt .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px rgba(255,255,255,.22);transition:background-color .4s}
.dd-btn .dd-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn .n{background:rgba(255,255,255,.2);color:inherit}
.dd-btn .chev{transition:transform .4s var(--pop)}
.dd-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.ddback{position:fixed;inset:0;z-index:940;background:rgba(var(--sh),.5);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.ddback.open{opacity:1;visibility:visible;transition-delay:0s}
.ddp{position:fixed;left:0;right:0;bottom:0;z-index:950;display:flex;flex-direction:column;max-height:80dvh;background:var(--surface);border-radius:26px 26px 0 0;clip-path:var(--cut);transform:translateY(102%);visibility:hidden;transition:transform .4s var(--ease),visibility 0s .4s;overscroll-behavior:contain}
.ddp.open{transform:none;visibility:visible;transition-delay:0s}
.ddh{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px 20px;font-family:var(--display);font-weight:var(--tw);font-size:1.2rem;color:var(--head)}
.ddh::before{content:"";position:absolute;top:8px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--line)}
.ddx{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--bg2);transition:transform .3s var(--pop)}
.ddx:active{transform:rotate(90deg) scale(.9)}
.ddl{overflow-y:auto;padding:0 10px calc(14px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.grp{display:flex;justify-content:space-between;padding:16px 10px 6px;font-family:var(--display);font-weight:var(--tw);font-size:1rem;color:var(--head)}
.grp span{font-family:var(--sans);font-size:.76rem;font-weight:650;color:var(--ink2)}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 12px 0 14px;margin-top:4px;border-radius:calc(var(--r) * .6);clip-path:var(--cut-s);background:var(--bg);color:var(--ink);font-size:.92rem;font-weight:650;text-align:left;transition:background-color .25s,color .25s,transform .2s var(--ease)}
.opt:active{transform:scale(.97)}
.opt .on{flex:1;min-width:0}
.opt svg{opacity:0;transform:scale(.4);transition:opacity .25s,transform .4s var(--pop)}
.opt.active{background:var(--on-bg);color:var(--on-fg)}
.opt.active svg{opacity:1;transform:none}
.opt.active .dot{background:currentColor}
.opt.active .n{background:rgba(255,255,255,.2);color:inherit}
.ddp.open .opt,.ddp.open .grp{animation:rise .4s var(--ease) calc(var(--k,0)*22ms) both}

}

}

}

let h=o('all','Todos los productos',total,accOf(0),activeCategory==='all');
const gs=new Map();list.forEach(x=>{const[g,r]=grpOf(x.cat.nombre);if(!gs.has(g))gs.set(g,[]);gs.get(g).push({...x,r:r||x.cat.nombre})});

const MU={'100% Cuero Vacuno':'vacuno','Bio-Cuero':'bio'},MR={vacuno:'100% Cuero Vacuno',bio:'Bio-Cuero'};
function updateURLParams(){try{const p=new URLSearchParams(location.search);
activeCategory!=='all'?p.set('categoria',activeCategory):p.delete('categoria');
activeMaterial!=='all'?p.set('material',MU[activeMaterial]||activeMaterial):p.delete('material');
const q=p.toString();history.replaceState(null,'',location.pathname+(q?'?'+q:'')+location.hash)}catch(e){}}
function applyURLParams(){try{const p=new URLSearchParams(location.search),m=(p.get('material')||'').toLowerCase(),c=p.get('categoria');
if(m&&MR[m])activeMaterial=MR[m];

if(c){const cat=catalogo.categorias.find(x=>x.id===c);if(cat&&countFor(cat)>0)activeCategory=c}}catch(e){}

function scrollToResultsTop(){const t=$('productsContainer'),c=$('controls');if(!t)return;

function getFiltered(){const out=[];

if(searchQuery&&!norm(p.codigo+' '+p.nombre+' '+p.color+' '+p.textura+' '+cat.nombre).includes(searchQuery))return;
out.push({...p,categoria:cat,ci})})});
